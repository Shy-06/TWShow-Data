name: build-ics

on:
  push:

permissions:
  contents: write

jobs:
  build-ics:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate ICS files
        run: python scripts/build_ics.py
      - name: Commit updated ICS files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add subFull.ics subRecent.ics subUpcoming.ics subRecruiting.ics
            git commit -m "chore: update subscriptions [skip ci]"
            git push
          fi
